name: GEPA custom proposer budget presubmit
run-name: GEPA proposer budget candidate e18ec16

on:
  push:
    branches:
      - codex-ci/gepa-proposer-budget-20261108-16d6748

permissions:
  contents: read

jobs:
  presubmit:
    if: >-
      github.repository == 'GoldArowana/gepa' &&
      github.ref == 'refs/heads/codex-ci/gepa-proposer-budget-20261108-16d6748'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: e18ec16ef1da94dc71100a6777559ad0335c580d
      EXPECTED_TREE: 756c88514c3ccaccda6dba430d03bec1c190287d
      UV_NO_CACHE: '1'
      PRE_COMMIT_HOME: /tmp/gepa-proposer-budget-precommit
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoldArowana/gepa
          ref: e18ec16ef1da94dc71100a6777559ad0335c580d
          fetch-depth: 1
          persist-credentials: false
      - name: Assert source repository and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'GoldArowana/gepa'
          source_url=$(git remote get-url origin)
          test "${source_url%.git}" = 'https://github.com/GoldArowana/gepa'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff HEAD --exit-code
          printf 'source_repo=%s source_head=%s source_tree=%s event_head=%s upstream_base=cb7674c8b231270134b8e5ea8b9db1a62ed8d081\n' \
            "$GITHUB_REPOSITORY" "$EXPECTED_HEAD" "$EXPECTED_TREE" "$GITHUB_SHA"
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Install locked development dependencies
        run: |
          uv sync --locked --extra dev --python 3.11
          git diff HEAD --exit-code
      - name: Run pinned applicable pre-commit hooks
        run: >
          uv run --no-sync pre-commit run --show-diff-on-failure --files
          src/gepa/api.py tests/test_optimize.py docs/docs/guides/cost-tracking.md
      - name: Run configured Pyright
        run: uv run --no-sync pyright
      - name: Run focused offline GEPA tests
        run: >
          uv run --no-sync pytest -q -p no:cacheprovider -m 'not llm_live and not extra'
          tests/test_optimize.py tests/test_reflection_lm.py tests/test_timeout_stop_condition.py
      - name: Verify candidate source stayed clean
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git diff HEAD --exit-code
          printf 'verified_final_head=%s verified_final_tree=%s\n' "$EXPECTED_HEAD" "$EXPECTED_TREE"
