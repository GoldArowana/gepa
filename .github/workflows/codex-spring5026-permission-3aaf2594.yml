name: Validate Spring read-only checkpoint fixture
on:
  push:
    branches:
      - codex-ci/spring5026-permission-3aaf2594

permissions:
  contents: read

jobs:
  readonly-fixture:
    if: github.repository == 'GoldArowana/gepa' && github.event_name == 'push' && github.ref == 'refs/heads/codex-ci/spring5026-permission-3aaf2594'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: spring-source
    steps:
      - name: Check out exact Spring source
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GoldArowana/spring-ai-alibaba
          ref: 6194e1d8ad00d5608e628e23ecbdaddc209cabed
          path: spring-source
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source and fixture bytes
        run: |
          source_url=https://github.com/GoldArowana/spring-ai-alibaba
          origin="$(git remote get-url origin)"
          test "$origin" = "$source_url" || test "$origin" = "$source_url.git"
          test "$(git rev-parse HEAD)" = 6194e1d8ad00d5608e628e23ecbdaddc209cabed
          test "$(git rev-parse 'HEAD^{tree}')" = f21245312f67afff7dbaf790f19e1b0473ff65ac
          fixture=spring-ai-alibaba-graph-core/src/test/java/com/alibaba/cloud/ai/graph/checkpoint/savers/file/FileSystemSaverCopyFailureTest.java
          test "$(git hash-object "$fixture")" = a20e53ff87f5da18356f13be42460bcfd6f6f8ea
          git diff HEAD --exit-code
          git show -s --format='SPRING_SOURCE head=%H tree=%T'
          printf 'HARNESS_EVENT repo=%s commit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify unprivileged Linux and actual Maven runtime
        run: |
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          awk '/^CapEff:/ { found = 1; if ($2 !~ /^0+$/) exit 1 } END { if (!found) exit 1 }' /proc/self/status
          printf 'UNPRIVILEGED_LINUX_UID=%s\n' "$(id -u)"
          java -version
          ./mvnw --version
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')" = 17
          git diff HEAD --exit-code

      - name: Execute only the read-only-target test method
        run: |
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=true \
            '-Dtest=FileSystemSaverCopyFailureTest#readOnlyTargetFailsBeforeChangingOldBytes' \
            -Dsurefire.failIfNoSpecifiedTests=false test
          git diff HEAD --exit-code

      - name: Require exactly one executed test and no skips
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          module = Path("spring-ai-alibaba-graph-core")
          class_name = "com.alibaba.cloud.ai.graph.checkpoint.savers.file.FileSystemSaverCopyFailureTest"
          method_name = "readOnlyTargetFailsBeforeChangingOldBytes"
          expected_report = module / "target" / "surefire-reports" / f"TEST-{class_name}.xml"
          reports = sorted(Path(".").glob("**/target/surefire-reports/TEST-*.xml"))
          if reports != [expected_report]:
              raise SystemExit(f"Unexpected Surefire report set: {reports}")
          suite = ET.parse(expected_report).getroot()
          counts = {name: int(suite.attrib[name]) for name in ("tests", "failures", "errors", "skipped")}
          cases = suite.findall("testcase")
          if (
              counts != {"tests": 1, "failures": 0, "errors": 0, "skipped": 0}
              or len(cases) != 1
              or cases[0].attrib.get("classname") != class_name
              or cases[0].attrib.get("name") != method_name
              or any(cases[0].find(tag) is not None for tag in ("skipped", "error", "failure"))
          ):
              raise SystemExit(f"Exact executed test required: {counts} {[(c.attrib.get('classname'), c.attrib.get('name')) for c in cases]}")
          runtime = suite.find("./properties/property[@name='java.specification.version']")
          if runtime is None or runtime.attrib.get("value") != "17":
              raise SystemExit("Surefire XML must attest the JDK 17 test JVM")
          print(f"EXACT_TEST_EXECUTED class={class_name} method={method_name} counts={counts} jdk=17")
          PY

      - name: Verify final tracked Spring source even on failure
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = 6194e1d8ad00d5608e628e23ecbdaddc209cabed
          test "$(git rev-parse 'HEAD^{tree}')" = f21245312f67afff7dbaf790f19e1b0473ff65ac
          git diff HEAD --exit-code
          git diff --cached --exit-code
          echo SPRING_SOURCE_UNCHANGED_FINAL
