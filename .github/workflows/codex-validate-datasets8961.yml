name: Validate Datasets add_item uint64 PR8961

on:
  push:
    branches:
      - codex-ci/datasets8961-add-item-20261105-3d8c6dd

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RUN_REMOTE: "0"
      RUN_SLOW: "0"
      PIP_NO_CACHE_DIR: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GoldArowana/datasets
          ref: 3d8c6dd6335b3526608e58ec2e0f5de43cde1914
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact published source
        run: |
          test "$(git rev-parse HEAD)" = "3d8c6dd6335b3526608e58ec2e0f5de43cde1914"
          test "$(git rev-parse 'HEAD^{tree}')" = "4f7240026f9aa442bc4571d2c7b83b1da90ae39d"
          git show -s --format='source=%H tree=%T'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install package and collection dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir -e . pytest absl-py pytest-datadir pytest-xdist aiohttp decorator
          python - <<'PY'
          import importlib.metadata as m
          import pathlib
          import sys
          import datasets
          import pyarrow
          assert pathlib.Path(datasets.__file__).resolve().is_relative_to(pathlib.Path.cwd() / "src")
          print("python", sys.version)
          print("datasets_source", pathlib.Path(datasets.__file__).resolve())
          for package in ("pyarrow", "numpy", "pandas", "huggingface-hub", "absl-py", "pytest"):
              print(package, m.version(package))
          PY
      - name: Existing add_item and adjacent add_column regressions
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_arrow_dataset.py -k 'add_item or add_column' --junitxml="$RUNNER_TEMP/existing-add-item-and-column.xml"
      - name: All new uint64 regressions
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_add_item_uint64.py --junitxml="$RUNNER_TEMP/uint64.xml"
      - name: Report exact test counts
        if: always()
        run: |
          python - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          for name in ("existing-add-item-and-column.xml", "uint64.xml"):
              path = pathlib.Path(os.environ["RUNNER_TEMP"]) / name
              if not path.exists():
                  print(name, "not produced; inspect the earlier failed step")
                  continue
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              counts = {key: sum(int(suite.attrib.get(key, 0)) for suite in suites) for key in ("tests", "failures", "errors", "skipped")}
              print(name, counts)
          PY
      - name: Confirm tracked source unchanged
        run: git diff --exit-code
