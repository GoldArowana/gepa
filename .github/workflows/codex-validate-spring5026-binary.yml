name: Validate Spring binary conversion
on:
  push:
    branches:
      - codex-ci/spring5026-binary-20261107-6194e1d
permissions:
  contents: read
jobs:
  normal-saver-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GoldArowana/spring-ai-alibaba
          ref: 6194e1d8ad00d5608e628e23ecbdaddc209cabed
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact candidate
        id: source
        run: |
          test "$(git rev-parse HEAD)" = 6194e1d8ad00d5608e628e23ecbdaddc209cabed
          test "$(git rev-parse 'HEAD^{tree}')" = f21245312f67afff7dbaf790f19e1b0473ff65ac
          git diff HEAD --exit-code
          git show -s --format='CANDIDATE source=%H tree=%T'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Record actual runtime
        run: |
          java -version
          ./mvnw --version
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')" = '${{ matrix.java }}'
      - name: Candidate real Maven five safe classes
        id: candidate
        run: |
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=true \
            -Dtest=UserMessageMediaSerializationTest,UserMessageMediaReadConstraintsTest,FileSystemSaverSerializationFailureTest,FileSystemSaverCacheTest,FileSystemSaverScratchReopenTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify actual candidate counts and source
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'UserMessageMediaSerializationTest': 44, 'UserMessageMediaReadConstraintsTest': 35,
                      'FileSystemSaverSerializationFailureTest': 7, 'FileSystemSaverCacheTest': 5,
                      'FileSystemSaverScratchReopenTest': 13}
          seen = {}
          jackson_jars = set()
          for file in Path('spring-ai-alibaba-graph-core/target/surefire-reports').glob('TEST-*.xml'):
              suite = ET.parse(file).getroot()
              name = suite.attrib['name'].rsplit('.', 1)[-1]
              assert name in expected and name not in seen, name
              row = {key: int(suite.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
              print('CANDIDATE_SUITE', name, row)
              assert row == dict(tests=expected[name], failures=0, errors=0, skipped=0), (name, row)
              seen[name] = row
              for prop in suite.findall('properties/property'):
                  if prop.attrib.get('name') in ('java.class.path', 'surefire.test.class.path'):
                      jackson_jars.update(Path(item).name for item in prop.attrib.get('value', '').split(':') if 'jackson-' in Path(item).name and item.endswith('.jar'))
          assert set(seen) == set(expected)
          print('ACTUAL_JACKSON_CLASSPATH', sorted(jackson_jars))
          assert any(name.startswith('jackson-databind-') for name in jackson_jars)
          print('CANDIDATE_TOTAL_PASSED', sum(row['tests'] for row in seen.values()))
          PYTEST
          git diff HEAD --exit-code
          echo CANDIDATE_SOURCE_UNCHANGED_AFTER_TESTS
      - name: Read-only Spotless and POM verification
        run: |
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dspotless.check.skip=false -Dmaven.sorter.skip=true \
            com.diffplug.spotless:spotless-maven-plugin:2.44.5:check
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=false -Dmaven.sorter.verifyFail=stop \
            io.github.tonycody.maven.plugins:sorter-maven-plugin:1.0.1:check
          git diff HEAD --exit-code
      - name: Exact published handler base control with normal conversion tests
        id: control
        run: |
          echo BASE_HANDLER_CONTROL_START
          git fetch --no-tags --depth=1 origin c18485ff9084ad67b276ff6f171abc06fe82f05a
          git show c18485ff9084ad67b276ff6f171abc06fe82f05a:spring-ai-alibaba-graph-core/src/main/java/com/alibaba/cloud/ai/graph/serializer/plain_text/jackson/UserMessageHandler.java > spring-ai-alibaba-graph-core/src/main/java/com/alibaba/cloud/ai/graph/serializer/plain_text/jackson/UserMessageHandler.java
          python3 - <<'CONTROL'
          from pathlib import Path
          import hashlib
          raw = Path('spring-ai-alibaba-graph-core/src/main/java/com/alibaba/cloud/ai/graph/serializer/plain_text/jackson/UserMessageHandler.java').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '2230e2d322653e2327c2d097d779025db4a4db9ef641332a3cdcdaea0700a920'
          CONTROL
          set +e
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=true \
            -Dtest=UserMessageMediaSerializationTest -Dsurefire.failIfNoSpecifiedTests=false test
          control_exit=$?
          set -e
          test "$control_exit" = 1
          python3 - <<'CONTROLRESULT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suite = ET.parse('spring-ai-alibaba-graph-core/target/surefire-reports/TEST-com.alibaba.cloud.ai.graph.plain_text.UserMessageMediaSerializationTest.xml').getroot()
          counts = {key: int(suite.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('BASE_HANDLER_CONTROL_COUNTS', counts)
          assert counts['tests'] == 44 and counts['failures'] + counts['errors'] == 5 and counts['skipped'] == 0, counts
          broken = []
          for case in suite.findall('testcase'):
              problem = case.find('failure')
              if problem is None:
                  problem = case.find('error')
              if problem is not None:
                  assert case.attrib['name'].startswith(('shouldRetainBinaryMediaDuringInMemoryConversion', 'shouldKeepBinaryReadBudgetDuringInMemoryConversion', 'shouldHonorReaderBudgetForNativeBinaryTrees')), case.attrib['name']
                  assert 'User message media data must be a string' in ET.tostring(problem, encoding='unicode')
                  broken.append(case.attrib['name'])
          assert len(broken) == 5, broken
          print('BASE_HANDLER_CONTROL_EXPECTED_CONVERSION_FAILURES_VERIFIED', broken)
          CONTROLRESULT
      - name: Uncommitted v1 native-budget regression control
        if: ${{ steps.control.outcome == 'success' }}
        run: |
          echo DRAFT_V1_NATIVE_READ_CONTROL_START
          python3 - <<'DRAFT'
          from pathlib import Path
          import base64
          import hashlib
          raw = base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest() == 'bd6d571229fd04ee05f7e00dbbc1f4a8ab5c960b616c4cccdba0538bf8c60962'
          Path('spring-ai-alibaba-graph-core/src/main/java/com/alibaba/cloud/ai/graph/serializer/plain_text/jackson/UserMessageHandler.java').write_bytes(raw)
          DRAFT
          set +e
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=true \
            '-Dtest=UserMessageMediaSerializationTest#shouldHonorReaderBudgetForNativeBinaryTrees' \
            -Dsurefire.failIfNoSpecifiedTests=false test
          control_exit=$?
          set -e
          test "$control_exit" = 1
          python3 - <<'DRAFTRESULT'
          import xml.etree.ElementTree as ET
          suite = ET.parse('spring-ai-alibaba-graph-core/target/surefire-reports/TEST-com.alibaba.cloud.ai.graph.plain_text.UserMessageMediaSerializationTest.xml').getroot()
          counts = {key: int(suite.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('DRAFT_V1_NATIVE_READ_CONTROL_COUNTS', counts)
          assert counts == dict(tests=1, failures=1, errors=0, skipped=0), counts
          case = suite.find('testcase')
          assert case.attrib['name'] == 'shouldHonorReaderBudgetForNativeBinaryTrees'
          assert 'nothing was thrown' in ET.tostring(case.find('failure'), encoding='unicode')
          print('DRAFT_V1_NATIVE_READ_EXPECTED_FAILURE_VERIFIED')
          DRAFTRESULT
      - name: Restore candidate and prove final tracked source
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: |
          git restore --source=6194e1d8ad00d5608e628e23ecbdaddc209cabed -- spring-ai-alibaba-graph-core/src/main/java/com/alibaba/cloud/ai/graph/serializer/plain_text/jackson/UserMessageHandler.java
          test "$(git rev-parse HEAD)" = 6194e1d8ad00d5608e628e23ecbdaddc209cabed
          test "$(git rev-parse 'HEAD^{tree}')" = f21245312f67afff7dbaf790f19e1b0473ff65ac
          git diff HEAD --exit-code
          git diff --cached --exit-code
          echo CANDIDATE_SOURCE_UNCHANGED_FINAL
