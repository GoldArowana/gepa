name: Validate Spring scratch reopen
on:
  push:
    branches:
      - codex-ci/spring5026-scratch-20261107-c18485f
permissions:
  contents: read
jobs:
  normal-saver-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: GoldArowana/spring-ai-alibaba
          ref: c18485ff9084ad67b276ff6f171abc06fe82f05a
          persist-credentials: false
          fetch-depth: 1
      - name: Assert exact candidate
        id: source
        run: |
          test "$(git rev-parse HEAD)" = c18485ff9084ad67b276ff6f171abc06fe82f05a
          test "$(git rev-parse 'HEAD^{tree}')" = cc649165e5c551a301d8bd282926f04a13139640
          git diff HEAD --exit-code
          git show -s --format='CANDIDATE source=%H tree=%T'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Record actual runtime
        run: |
          java -version
          ./mvnw --version
          test "$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*java.specification.version = //p')" = '${{ matrix.java }}'
      - name: Candidate real Maven five safe classes
        id: candidate
        run: |
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=true \
            -Dtest=UserMessageMediaSerializationTest,UserMessageMediaReadConstraintsTest,FileSystemSaverSerializationFailureTest,FileSystemSaverCacheTest,FileSystemSaverScratchReopenTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Verify actual candidate counts and source
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {'UserMessageMediaSerializationTest': 30, 'UserMessageMediaReadConstraintsTest': 35,
                      'FileSystemSaverSerializationFailureTest': 7, 'FileSystemSaverCacheTest': 5,
                      'FileSystemSaverScratchReopenTest': 13}
          seen = {}
          for file in Path('spring-ai-alibaba-graph-core/target/surefire-reports').glob('TEST-*.xml'):
              suite = ET.parse(file).getroot()
              name = suite.attrib['name'].rsplit('.', 1)[-1]
              assert name in expected and name not in seen, name
              row = {key: int(suite.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
              print('CANDIDATE_SUITE', name, row)
              assert row == dict(tests=expected[name], failures=0, errors=0, skipped=0), (name, row)
              seen[name] = row
          assert set(seen) == set(expected)
          print('CANDIDATE_TOTAL_PASSED', sum(row['tests'] for row in seen.values()))
          PYTEST
          git diff HEAD --exit-code
          echo CANDIDATE_SOURCE_UNCHANGED_AFTER_TESTS
      - name: Read-only Spotless and POM verification
        run: |
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dspotless.check.skip=false -Dmaven.sorter.skip=true \
            com.diffplug.spotless:spotless-maven-plugin:2.44.5:check
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=false -Dmaven.sorter.verifyFail=stop \
            io.github.tonycody.maven.plugins:sorter-maven-plugin:1.0.1:check
          git diff HEAD --exit-code
      - name: Base-equivalent seam control with original output behavior
        id: control
        run: |
          echo BASE_EQUIVALENT_SEAM_CONTROL_START
          python3 - <<'CONTROL'
          import base64
          from pathlib import Path
          raw = base64.b64decode('', validate=True)
          import hashlib
          assert hashlib.sha256(raw).hexdigest() == '86e629612afdb99f21523b5a70711ad4c8b2b0be811ec7945c451ee83dfe4110'
          Path('spring-ai-alibaba-graph-core/src/main/java/com/alibaba/cloud/ai/graph/checkpoint/savers/file/FileSystemSaver.java').write_bytes(raw)
          print('CONTROL_IS_INSTRUMENTED_SEAM_ONLY_BASE_WITH_ORIGINAL_CREATE_TRUNCATE_BEHAVIOR')
          CONTROL
          set +e
          ./mvnw -B -ntp -pl :spring-ai-alibaba-graph-core -am \
            -Dspotless.apply.skip=true -Dmaven.sorter.skip=true \
            -Dtest=FileSystemSaverScratchReopenTest -Dsurefire.failIfNoSpecifiedTests=false test
          result=$?
          set -e
          test "$result" = 1
          python3 - <<'CONTROLRESULT'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          file = Path('spring-ai-alibaba-graph-core/target/surefire-reports/TEST-com.alibaba.cloud.ai.graph.checkpoint.savers.file.FileSystemSaverScratchReopenTest.xml')
          suite = ET.parse(file).getroot()
          counts = {key: int(suite.attrib.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}
          print('BASE_EQUIVALENT_CONTROL_COUNTS', counts)
          assert counts == dict(tests=13, failures=10, errors=0, skipped=0), counts
          for case in suite.findall('testcase'):
              if case.find('failure') is not None:
                  assert case.attrib['name'].startswith(('shouldRejectMissingScratchBeforeTargetMutation', 'shouldRejectNonemptyScratchBeforeAnyPayloadWrite', 'shouldLeaveFirstSaveAbsentWhenNewScratchDisappears')), case.attrib['name']
          CONTROLRESULT
          echo BASE_EQUIVALENT_CONTROL_EXPECTED_FAILURES_VERIFIED
      - name: Restore candidate and prove final tracked source
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: |
          git restore --source=c18485ff9084ad67b276ff6f171abc06fe82f05a -- spring-ai-alibaba-graph-core/src/main/java/com/alibaba/cloud/ai/graph/checkpoint/savers/file/FileSystemSaver.java
          test "$(git rev-parse HEAD)" = c18485ff9084ad67b276ff6f171abc06fe82f05a
          test "$(git rev-parse 'HEAD^{tree}')" = cc649165e5c551a301d8bd282926f04a13139640
          git diff HEAD --exit-code
          git diff --cached --exit-code
          echo CANDIDATE_SOURCE_UNCHANGED_FINAL
