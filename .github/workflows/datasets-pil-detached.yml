name: Datasets loaded PIL missing local source baseline
on:
  push:
    branches: [validation-datasets-pil-detached-20261108]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
      DO_NOT_TRACK: "1"
      NO_COLOR: "1"
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout immutable upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: huggingface/datasets
          ref: a1269ca9dbb6e0858a9c375e8982329a3fcc84af
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Assert actual source and tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a1269ca9dbb6e0858a9c375e8982329a3fcc84af"
          test "$(git rev-parse 'HEAD^{tree}')" = "73a7b72ab68016dd160c6ca626bbf64b280057ce"
          printf 'Tested source huggingface/datasets\nEvent commit %s\n' "$GITHUB_SHA"
          python --version
          git diff HEAD --exit-code
      - name: Install normal package with its declared vision extra
        run: python -m pip install --no-cache-dir -e '.[vision]'
      - name: Verify bootstrap source bytes
        run: git diff HEAD --exit-code
      - name: Run small offline public SDK value comparisons
        env:
          DIAGNOSTIC_B64: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "datasets_pil_public_sdk_diagnostic.py"
          path.write_bytes(base64.b64decode(os.environ["DIAGNOSTIC_B64"], validate=True))
          PYCODE
          timeout 120s python "$RUNNER_TEMP/datasets_pil_public_sdk_diagnostic.py"
          git diff HEAD --exit-code
      - name: Execute expected-value regression on unchanged base
        env:
          REGRESSION_B64: 
        run: |
          set -euo pipefail
          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"datasets-pil-loaded-regression.py").write_bytes(base64.b64decode(os.environ["REGRESSION_B64"]))'
          set +e
          timeout 120s python -u "$RUNNER_TEMP/datasets-pil-loaded-regression.py"
          regression_exit=$?
          set -e
          printf 'EXPECTED_VALUE_REGRESSION_EXIT=%s\n' "$regression_exit"
          test "$regression_exit" -eq 1
      - name: Always verify unchanged exact source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a1269ca9dbb6e0858a9c375e8982329a3fcc84af"
          test "$(git rev-parse 'HEAD^{tree}')" = "73a7b72ab68016dd160c6ca626bbf64b280057ce"
          git diff HEAD --exit-code
