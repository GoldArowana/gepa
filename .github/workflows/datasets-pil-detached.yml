          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"datasets-pil-detached-final.py").write_bytes(base64.b64decode(os.environ["DIAGNOSTIC_B64"]))'
          timeout 120s python -u "$RUNNER_TEMP/datasets-pil-detached-final.py"
      - name: Run complete original image test file including new regressions
        run: |
          set -euo pipefail
