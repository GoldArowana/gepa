name: Datasets detached PIL final verification
on:
  push:
    branches: [validation-datasets-pil-detached-20261108]
permissions:
  contents: read
jobs:
  current:
    name: Python 3.12 and current Pillow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
      DO_NOT_TRACK: "1"
      NO_COLOR: "1"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoldArowana/datasets
          ref: 4368803b56cf40fe8d9ad4534e77dfcf36d88b35
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Assert actual candidate source and tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4368803b56cf40fe8d9ad4534e77dfcf36d88b35"
          test "$(git rev-parse 'HEAD^{tree}')" = "0e4320f0c37877f56316350235bdaf672deb38ce"
          printf 'Actual candidate 4368803b56cf40fe8d9ad4534e77dfcf36d88b35 tree 0e4320f0c37877f56316350235bdaf672deb38ce; event %s\n' "$GITHUB_SHA"
          python --version
          git diff HEAD --exit-code
      - name: Install normal vision quality and CPU image test dependencies
        run: python -m pip install --no-cache-dir -e '.[vision,quality]' pytest pytest-datadir pytest-xdist polars setuptools 
      - name: Verify bootstrap source bytes
        run: git diff HEAD --exit-code
      - name: Run identical expected-value regression
        env:
          REGRESSION_B64: 
        run: |
          set -euo pipefail
          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"datasets-pil-loaded-regression.py").write_bytes(base64.b64decode(os.environ["REGRESSION_B64"]))'
          timeout 120s python -u "$RUNNER_TEMP/datasets-pil-loaded-regression.py"
      - name: Run 28 public SDK boundary observations
        env:
          DIAGNOSTIC_B64: 
        run: |
          set -euo pipefail
          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"datasets-pil-detached-final.py").write_bytes(base64.b64decode(os.environ["DIAGNOSTIC_B64"]))'
          timeout 120s python -u "$RUNNER_TEMP/datasets-pil-detached-final.py"
      - name: Run complete original image test file including new regressions
        run: |
          set -euo pipefail
          set +e
          timeout 300s python -m pytest tests/features/test_image.py -q --junitxml="$RUNNER_TEMP/full-image.xml"
          full_image_exit=$?
          set -e
          printf 'FULL_IMAGE_EXIT=%s\n' "$full_image_exit"
          if test -f "$RUNNER_TEMP/full-image.xml"; then
            python -c 'import os,pathlib,base64; print("FULL_IMAGE_JUNIT_B64="+base64.b64encode(pathlib.Path(os.environ["RUNNER_TEMP"],"full-image.xml").read_bytes()).decode())'
          fi
          test "$full_image_exit" -eq 0
      - name: Run normal repository quality command
        run: timeout 180s make quality
      - name: Always verify unchanged exact candidate source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4368803b56cf40fe8d9ad4534e77dfcf36d88b35"
          test "$(git rev-parse 'HEAD^{tree}')" = "0e4320f0c37877f56316350235bdaf672deb38ce"
          git diff HEAD --exit-code
  minimum:
    name: Python 3.10 and minimum Pillow 9.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
