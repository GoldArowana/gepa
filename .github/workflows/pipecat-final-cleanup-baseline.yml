name: Pipecat isolated observed upstream failures
on:
  push:
    branches: [validation-pipecat-cleanup-owner-20261108]
permissions:
  contents: read
jobs:
  normal:
    name: ${{ matrix.case }} isolated failure nodes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - case: base
            repo: pipecat-ai/pipecat
            sha: 3dbb0c8445c0ddc2276d566140fe8d12f1d61e5b
            tree: d143e2a002a7c159429ab884f9f8fec6143e2b55
          - case: candidate
            repo: GoldArowana/pipecat
            sha: bc47787115c98056e67c516a41c9a5b40686291b
            tree: af94274f76749376cab2a12ee6fd6a1b1c24edc0
    defaults:
      run:
        working-directory: source
    env:
      UV_NO_CACHE: "1"
      PYTHONUNBUFFERED: "1"
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_SHA: ${{ matrix.sha }}
      SOURCE_TREE: ${{ matrix.tree }}
    steps:
      - name: Checkout exact asserted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Install normal upstream uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: false
      - name: Install normal upstream Python
        run: uv python install 3.12
      - name: Assert source and no supplied provider credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
          python3 - <<'PYCODE'
          import os
          names = ("OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GOOGLE_API_KEY", "GEMINI_API_KEY", "AZURE_OPENAI_API_KEY", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "DEEPGRAM_API_KEY", "CARTESIA_API_KEY", "ELEVENLABS_API_KEY", "SARVAM_API_KEY", "DAILY_API_KEY", "GOOGLE_APPLICATION_CREDENTIALS")
          assert not any(os.environ.get(name) for name in names), "No provider credentials may be supplied"
          print("Provider credentials supplied false")
          PYCODE
      - name: Install exact normal upstream test extras
        run: |
          uv sync --group dev \
            --extra aic \
            --extra anthropic \
            --extra aws \
            --extra aws-nova-sonic \
            --extra azure \
            --extra cli \
            --extra cloudflare \
            --extra daily \
            --extra deepgram \
            --extra google \
            --extra langchain \
            --extra livekit \
            --extra mcp \
            --extra moq \
            --extra openai \
            --extra pgmq \
            --extra piper \
            --extra redis \
            --extra resampy \
            --extra rime \
            --extra runner \
            --extra sagemaker \
            --extra sarvam \
            --extra speechmatics \
            --extra tracing \
            --extra typesafe \
            --extra websocket
      - name: Verify bootstrap preserves tracked source
        id: preflight
        run: git diff HEAD --exit-code
      - name: Isolate LLM expression reuse
        if: always() && steps.preflight.outcome == 'success'
        run: timeout 60s uv run pytest -n 0 -x -vv -s tests/test_llm_expression.py::test_the_perception_upstream_is_taught_with_the_tts_expression
      - name: Isolate turn-controller strategy stop
        if: always() && steps.preflight.outcome == 'success'
        run: timeout 60s uv run pytest -n 0 -x -vv -s tests/test_user_turn_controller.py::TestUserTurnController::test_handle_user_turn_stopped_called_on_strategy_stop
      - name: Isolate VAD with simple readonly task-chain timer
        if: always() && steps.preflight.outcome == 'success'
        run: |
          timeout --signal=TERM --kill-after=5s 75s uv run python - <<'PYCODE'
          import asyncio, signal, sys, pytest
          def dump(signum, frame):
              try:
                  tasks = asyncio.all_tasks()
              except RuntimeError:
                  print("TASK_SNAPSHOT no running loop", flush=True)
                  return
              for task in tasks:
                  print("TASK_SNAPSHOT", task.get_name(), "done", task.done(), flush=True)
                  coro = task.get_coro()
                  for _ in range(30):
                      current = getattr(coro, "cr_frame", None)
                      if current is not None:
                          print(current.f_code.co_filename, current.f_code.co_name, current.f_lineno, flush=True)
                      coro = getattr(coro, "cr_await", None)
                      if coro is None:
                          break
          signal.signal(signal.SIGALRM, dump)
          signal.alarm(30)
          sys.exit(pytest.main(["-n", "0", "-s", "-vv", "-o", "faulthandler_timeout=45", "tests/test_turn_start_vad_state.py::TestTurnStartVADState::test_transcript_only_turn_after_a_vad_turn_still_completes_promptly"]))
          PYCODE
      - name: Always verify asserted source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
