name: Pipecat final cleanup R6 compatible candidate validation
on:
  push:
    branches: [validation-pipecat-cleanup-owner-20261108]
permissions:
  contents: read
jobs:
  validation:
    name: ${{ matrix.case }} Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: candidate
            python: "3.12"
            repo: GoldArowana/pipecat
            source_sha: c1d171d6f96dcca6a8d79888ac34ed34f7a3ed88
            source_tree: 2aef8b08d946179dc9ce59ea4e52355cac969dc0
          - case: candidate
            python: "3.11"
            repo: GoldArowana/pipecat
            source_sha: c1d171d6f96dcca6a8d79888ac34ed34f7a3ed88
            source_tree: 2aef8b08d946179dc9ce59ea4e52355cac969dc0
    defaults:
      run:
        working-directory: source
    env:
      UV_NO_CACHE: "1"
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_SHA: ${{ matrix.source_sha }}
      SOURCE_TREE: ${{ matrix.source_tree }}
    steps:
      - name: Checkout exact asserted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Assert actual source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          printf 'Source repository %s\nSource commit %s\nSource tree %s\nCI event %s\n' "$SOURCE_REPO" "$SOURCE_SHA" "$SOURCE_TREE" "$GITHUB_SHA"
          python --version
          uv --version
          git diff HEAD --exit-code
      - name: Install normal frozen development environment
        run: uv sync --frozen --group dev
      - name: Verify bootstrap preserves tracked source
        run: git diff HEAD --exit-code
      - name: Run existing TaskManager tests
        run: uv run --no-sync python -m pytest -n 0 tests/test_task_manager.py
      - name: Run identical expected-value public cleanup regression
        env:
          DIAGNOSTIC_B64: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, os, hashlib
          from pathlib import Path
          data = base64.b64decode(os.environ["DIAGNOSTIC_B64"], validate=True)
          assert hashlib.sha256(data).hexdigest() == "1fbbd4666248cc5d656958a7ca41ac62ada2add0cfa9394d064cbd12dcc9cef7"
          (Path(os.environ["RUNNER_TEMP"]) / "pipecat_cleanup_regression.py").write_bytes(data)
          PYCODE
          PYTHONPATH="$PWD:$PWD/src" timeout 30s uv run --no-sync python "$RUNNER_TEMP/pipecat_cleanup_regression.py"
      - name: Preserve completed active watcher result propagation
        env:
          ACTIVE_PROBE_B64: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, os, hashlib
          from pathlib import Path
          data = base64.b64decode(os.environ["ACTIVE_PROBE_B64"], validate=True)
          assert hashlib.sha256(data).hexdigest() == "3b9dfd5dec7bfaf295d2c1e02ef173e76a15d22077709f1909fdc174fb762ea7"
          (Path(os.environ["RUNNER_TEMP"]) / "pipecat_completed_watcher_regression.py").write_bytes(data)
          PYCODE
          PYTHONPATH="$PWD:$PWD/src" timeout 30s uv run --no-sync python "$RUNNER_TEMP/pipecat_completed_watcher_regression.py"
      - name: Run existing and focused processor lifecycle tests
        if: matrix.case == 'candidate'
        run: uv run --no-sync python -m pytest -n 0 tests/test_frame_processor.py tests/test_frame_processor_cleanup.py tests/test_frame_processor_setup_lifecycle.py
      - name: Check candidate source and test lint
        if: matrix.case == 'candidate'
        run: |
          uv run --no-sync ruff check src/pipecat/processors/frame_processor.py tests/test_frame_processor_cleanup.py tests/test_frame_processor_setup_lifecycle.py
          uv run --no-sync ruff format --check --diff src/pipecat/processors/frame_processor.py tests/test_frame_processor_cleanup.py tests/test_frame_processor_setup_lifecycle.py
      - name: Always verify unchanged asserted source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
  normal:
    needs: validation
    name: R6 normal upstream suite
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: candidate
            repo: GoldArowana/pipecat
            sha: c1d171d6f96dcca6a8d79888ac34ed34f7a3ed88
            tree: 2aef8b08d946179dc9ce59ea4e52355cac969dc0
    defaults:
      run:
        working-directory: source
    env:
      UV_NO_CACHE: "1"
      PYTHONUNBUFFERED: "1"
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_SHA: ${{ matrix.sha }}
      SOURCE_TREE: ${{ matrix.tree }}
    steps:
      - name: Checkout exact asserted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - name: Install normal upstream uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: false
      - name: Install normal upstream Python
        run: uv python install 3.12
      - name: Assert source and no supplied provider credentials
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
          python3 - <<'PYCODE'
          import os
          names = ("OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GOOGLE_API_KEY", "GEMINI_API_KEY", "AZURE_OPENAI_API_KEY", "AWS_ACCESS_KEY_ID", "AWS_SECRET_ACCESS_KEY", "DEEPGRAM_API_KEY", "CARTESIA_API_KEY", "ELEVENLABS_API_KEY", "SARVAM_API_KEY", "DAILY_API_KEY", "GOOGLE_APPLICATION_CREDENTIALS")
          assert not any(os.environ.get(name) for name in names), "No provider credentials may be supplied"
          print("Provider credentials supplied false")
          PYCODE
      - name: Install exact normal upstream test extras
        run: |
          uv sync --group dev \
            --extra aic \
            --extra anthropic \
            --extra aws \
            --extra aws-nova-sonic \
            --extra azure \
            --extra cli \
            --extra cloudflare \
            --extra daily \
            --extra deepgram \
            --extra google \
            --extra langchain \
            --extra livekit \
            --extra mcp \
            --extra moq \
            --extra openai \
            --extra pgmq \
            --extra piper \
            --extra redis \
            --extra resampy \
            --extra rime \
            --extra runner \
            --extra sagemaker \
            --extra sarvam \
            --extra speechmatics \
            --extra tracing \
            --extra typesafe \
            --extra websocket
      - name: Verify bootstrap preserves tracked source
        run: git diff HEAD --exit-code
      - name: Run normal xdist suite with bounded observational diagnostics
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 480s uv run pytest -n 8 -vv -o faulthandler_timeout=180
          result=$?
          printf 'ACTUAL_NORMAL_SUITE_EXIT_CODE=%s\n' "$result"
          exit "$result"
      - name: Always verify asserted source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
  quality:
    name: R6 normal upstream code quality
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: source
    env:
      UV_NO_CACHE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoldArowana/pipecat
          ref: c1d171d6f96dcca6a8d79888ac34ed34f7a3ed88
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "latest"
          enable-cache: false
      - name: Normal upstream Python
        run: uv python install 3.12
      - name: Assert source
        run: |
          test "$(git rev-parse HEAD)" = "c1d171d6f96dcca6a8d79888ac34ed34f7a3ed88"
          test "$(git rev-parse 'HEAD^{tree}')" = "2aef8b08d946179dc9ce59ea4e52355cac969dc0"
          git diff HEAD --exit-code
      - name: Normal upstream quality bootstrap
        run: uv sync --group dev --all-extras --no-extra gstreamer --no-extra local
      - name: Normal upstream quality commands
        run: |
          uv run ruff format --diff
          uv run ruff check
          uv run pyright
          uv run scripts/cli/update_registry.py
          git diff --exit-code src/pipecat/cli/registry/_imports.py src/pipecat/cli/registry/_configs.py
      - name: Always verify source
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "c1d171d6f96dcca6a8d79888ac34ed34f7a3ed88"
          test "$(git rev-parse 'HEAD^{tree}')" = "2aef8b08d946179dc9ce59ea4e52355cac969dc0"
          git diff HEAD --exit-code
