name: Pipecat final cleanup expected-value baseline
on:
  push:
    branches: [validation-pipecat-cleanup-owner-20261108]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.11"]
    defaults:
      run:
        working-directory: source
    env:
      UV_NO_CACHE: "1"
    steps:
      - name: Checkout exact upstream source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: pipecat-ai/pipecat
          ref: 3dbb0c8445c0ddc2276d566140fe8d12f1d61e5b
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Assert actual source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3dbb0c8445c0ddc2276d566140fe8d12f1d61e5b"
          test "$(git rev-parse 'HEAD^{tree}')" = "d143e2a002a7c159429ab884f9f8fec6143e2b55"
          printf 'Source repository pipecat-ai/pipecat\nEvent commit %s\n' "$GITHUB_SHA"
          python --version
          uv --version
          git diff HEAD --exit-code
      - name: Install normal frozen development environment
        run: uv sync --frozen --group dev
      - name: Verify bootstrap preserves tracked source
        run: git diff HEAD --exit-code
      - name: Run existing TaskManager tests
        run: uv run --no-sync python -m pytest tests/test_task_manager.py
      - name: Require bounded final internal-task cleanup
        env:
          DIAGNOSTIC_B64: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, os
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "pipecat_cleanup_regression.py"
          target.write_bytes(base64.b64decode(os.environ["DIAGNOSTIC_B64"], validate=True))
          PYCODE
          PYTHONPATH="$PWD:$PWD/src" timeout 30s uv run --no-sync python "$RUNNER_TEMP/pipecat_cleanup_regression.py"
      - name: Always verify unchanged actual source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3dbb0c8445c0ddc2276d566140fe8d12f1d61e5b"
          test "$(git rev-parse 'HEAD^{tree}')" = "d143e2a002a7c159429ab884f9f8fec6143e2b55"
          git diff HEAD --exit-code
