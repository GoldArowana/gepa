name: Pipecat completed active watcher result control
on:
  push:
    branches: [validation-pipecat-cleanup-owner-20261108]
permissions:
  contents: read
jobs:
  validation:
    name: ${{ matrix.case }} Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: base
            python: "3.12"
            repo: pipecat-ai/pipecat
            source_sha: 3dbb0c8445c0ddc2276d566140fe8d12f1d61e5b
            source_tree: d143e2a002a7c159429ab884f9f8fec6143e2b55
          - case: base
            python: "3.11"
            repo: pipecat-ai/pipecat
            source_sha: 3dbb0c8445c0ddc2276d566140fe8d12f1d61e5b
            source_tree: d143e2a002a7c159429ab884f9f8fec6143e2b55
          - case: reviewed-R4
            python: "3.12"
            repo: GoldArowana/pipecat
            source_sha: 37497d8863eed50c68f7c9e01e91c413270c53d1
            source_tree: d4b4179b994daf3220defe51d99f03345c2d9649
          - case: reviewed-R4
            python: "3.11"
            repo: GoldArowana/pipecat
            source_sha: 37497d8863eed50c68f7c9e01e91c413270c53d1
            source_tree: d4b4179b994daf3220defe51d99f03345c2d9649
    defaults:
      run:
        working-directory: source
    env:
      UV_NO_CACHE: "1"
      SOURCE_REPO: ${{ matrix.repo }}
      SOURCE_SHA: ${{ matrix.source_sha }}
      SOURCE_TREE: ${{ matrix.source_tree }}
    steps:
      - name: Checkout exact asserted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.source_sha }}
          path: source
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - name: Assert actual source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          printf 'Source repository %s\nSource commit %s\nSource tree %s\nCI event %s\n' "$SOURCE_REPO" "$SOURCE_SHA" "$SOURCE_TREE" "$GITHUB_SHA"
          python --version
          uv --version
          git diff HEAD --exit-code
      - name: Install normal frozen development environment
        run: uv sync --frozen --group dev
      - name: Verify bootstrap preserves tracked source
        run: git diff HEAD --exit-code
      - name: Run existing TaskManager tests
        run: uv run --no-sync python -m pytest -n 0 tests/test_task_manager.py
      - name: Preserve completed active watcher result propagation
        env:
          DIAGNOSTIC_B64: 
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import base64, os, hashlib
          from pathlib import Path
          data = base64.b64decode(os.environ["DIAGNOSTIC_B64"], validate=True)
          assert hashlib.sha256(data).hexdigest() == "3b9dfd5dec7bfaf295d2c1e02ef173e76a15d22077709f1909fdc174fb762ea7"
          (Path(os.environ["RUNNER_TEMP"]) / "pipecat_completed_watcher_regression.py").write_bytes(data)
          PYCODE
          PYTHONPATH="$PWD:$PWD/src" timeout 30s uv run --no-sync python "$RUNNER_TEMP/pipecat_completed_watcher_regression.py"
      - name: Always verify unchanged asserted source
        if: always()
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git diff HEAD --exit-code
